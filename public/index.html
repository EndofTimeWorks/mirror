<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirror - Receiver</title>
    <style>
      body {
        background: #000;
        color: #fff;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
      }
      #video-container {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        grid-auto-rows: minmax(0, 1fr);
        gap: 6px;
        padding: 6px;
        box-sizing: border-box;
      }
      .screen-tile {
        position: relative;
        min-width: 0;
        min-height: 0;
        background: #111;
        overflow: hidden;
        cursor: grab;
      }
      .screen-tile.dragging {
        opacity: 0.45;
      }
      .screen-tile.drag-target {
        outline: 3px solid #4af;
        outline-offset: -3px;
      }
      .screen-tile video {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        object-fit: contain;
        pointer-events: none;
      }
      .screen-label {
        position: absolute;
        top: 8px;
        right: 8px;
        padding: 5px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.65);
        font-size: 0.85rem;
        pointer-events: none;
      }
      #layout-controls {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: none;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.65);
      }
      #layout-controls select {
        font: inherit;
      }
      #status {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 8px;
        z-index: 9999;
        pointer-events: none;
      }
      #qr-container {
        text-align: center;
      }
      #link {
        font-size: 1.5em;
        margin-top: 20px;
        color: #4af;
        text-decoration: none;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="status">Connecting...</div>

    <div id="layout-controls">
      <span>Layout</span>
      <select id="column-count" aria-label="Screen columns">
        <option value="auto">Auto</option>
        <option value="1">1 column</option>
        <option value="2">2 columns</option>
        <option value="3">3 columns</option>
        <option value="4">4 columns</option>
      </select>
      <span>Drag screens to reorder</span>
    </div>

    <div id="qr-container">
      <h1>Scan to Cast</h1>
      <img
        id="qr-img"
        src=""
        alt="QR Code"
        style="
          display: none;
          background: white;
          padding: 10px;
          border-radius: 10px;
        "
      />
      <br />
      <a id="link" href="#" target="_blank">Loading...</a>
    </div>

    <div id="video-container" style="display: none"></div>

    <script>
      const statusEl = document.getElementById("status");
      const qrContainer = document.getElementById("qr-container");
      const videoContainer = document.getElementById("video-container");
      const linkEl = document.getElementById("link");
      const qrImg = document.getElementById("qr-img");
      const layoutControls = document.getElementById("layout-controls");
      const columnCount = document.getElementById("column-count");

      let pc;
      let ws;
      const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

      async function start() {
        try {
          const res = await fetch("/create");
          const data = await res.json();
          const sessionId = data.session_id;

          statusEl.innerText = `Session: ${sessionId}`;

          const host = window.location.host;
          const sendUrl = `http://${host}/send.html?session=${sessionId}`;

          linkEl.href = sendUrl;
          linkEl.innerText = sendUrl;
          qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(
            sendUrl
          )}`;
          qrImg.style.display = "inline-block";

          const protocol = window.location.protocol === "https:" ? "wss" : "ws";
          ws = new WebSocket(
            `${protocol}://${host}/ws?id=${sessionId}&role=receiver`
          );

          ws.onopen = () => {
            statusEl.innerText += " | WS Connected";
          };

          ws.onmessage = async (msg) => {
            const data = JSON.parse(msg.data);

            if (data.type === "offer") {
              console.log("RX Offer");
              statusEl.innerText = "Received Offer. Signaling...";
              qrContainer.style.display = "none";
              videoContainer.style.display = "grid";
              layoutControls.style.display = "flex";

              if (!pc) setupPeerConnection();
              await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));

              const answer = await pc.createAnswer();
              await pc.setLocalDescription(answer);

              ws.send(JSON.stringify({
                  type: "answer",
                  sdp: answer,
              }));
              if (pc.connectionState === "connected") {
                updateReceivingStatus();
              } else {
                statusEl.innerText = "Answer sent. Connecting...";
              }

            } else if (data.type === "ice") {
              if (pc) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
              }
            }
          };
        } catch (err) {
          console.error(err);
          statusEl.innerText = "Error: " + err.message;
        }
      }

      function setupPeerConnection() {
        pc = new RTCPeerConnection(config);

        pc.ontrack = (event) => {
          const stream = event.streams[0];
          if (!stream || document.querySelector(`[data-stream-id="${stream.id}"]`)) return;

          const tile = document.createElement("div");
          tile.className = "screen-tile";
          tile.draggable = true;
          tile.dataset.streamId = stream.id;

          const video = document.createElement("video");
          video.autoplay = true;
          video.playsInline = true;
          video.muted = true;
          video.srcObject = stream;

          const label = document.createElement("div");
          label.className = "screen-label";

          tile.append(video, label);
          videoContainer.appendChild(tile);
          refreshScreenLabels();

          tile.addEventListener("dragstart", () => {
            tile.classList.add("dragging");
          });

          tile.addEventListener("dragend", () => {
            tile.classList.remove("dragging");
            videoContainer.querySelectorAll(".drag-target").forEach((el) =>
              el.classList.remove("drag-target")
            );
            refreshScreenLabels();
          });

          tile.addEventListener("dragover", (event) => {
            event.preventDefault();
            if (!tile.classList.contains("dragging")) {
              tile.classList.add("drag-target");
            }
          });

          tile.addEventListener("dragleave", () => {
            tile.classList.remove("drag-target");
          });

          tile.addEventListener("drop", (event) => {
            event.preventDefault();
            tile.classList.remove("drag-target");

            const dragged = videoContainer.querySelector(".dragging");
            if (!dragged || dragged === tile) return;

            const rect = tile.getBoundingClientRect();
            const before =
              event.clientY < rect.top + rect.height / 2 ||
              (Math.abs(event.clientY - (rect.top + rect.height / 2)) < rect.height / 4 &&
                event.clientX < rect.left + rect.width / 2);

            videoContainer.insertBefore(dragged, before ? tile : tile.nextSibling);
            refreshScreenLabels();
          });

          event.track.onended = () => {
            tile.remove();
            refreshScreenLabels();
            updateReceivingStatus();
          };
          updateReceivingStatus();
        };

        pc.onicecandidate = (event) => {
          if (event.candidate) {
           console.log("Candidate:", event.candidate.candidate.split(" ")[4]);
            ws.send(
              JSON.stringify({
                type: "ice",
                candidate: event.candidate,
              })
            );
          }
        };

        pc.onconnectionstatechange = () => {
          if (pc.connectionState === "connected") {
            updateReceivingStatus();
          } else {
            statusEl.innerText = `Connection: ${pc.connectionState}`;
          }
        };
      }

      function refreshScreenLabels() {
        videoContainer.querySelectorAll(".screen-tile").forEach((tile, index) => {
          tile.querySelector(".screen-label").innerText = `Screen ${index + 1}`;
        });
      }

      function updateReceivingStatus() {
        const count = videoContainer.querySelectorAll(".screen-tile").length;
        statusEl.innerText = `Connected — receiving ${count} ${count === 1 ? "source" : "sources"}.`;
      }

      columnCount.addEventListener("change", () => {
        videoContainer.style.gridTemplateColumns =
          columnCount.value === "auto"
            ? "repeat(auto-fit, minmax(320px, 1fr))"
            : `repeat(${columnCount.value}, minmax(0, 1fr))`;
      });

      start();
    </script>
  </body>
</html>
